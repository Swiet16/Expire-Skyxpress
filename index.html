<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Expired - Skyxpress.site</title>
    <style>
        :root {
            --primary-color: #ff3333;
            --primary-hover: #e02424;
            --text-dark: #1f2937;
            --text-light: #4b5563;
            --bg-gray: #f9fafb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            text-align: center;
            border-top: 6px solid var(--primary-color);
        }

        .icon-container {
            width: 70px;
            height: 70px;
            background-color: #fef2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
        }

        .icon {
            width: 40px;
            height: 40px;
            color: var(--primary-color);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-dark);
        }

        .domain-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            background: #fef2f2;
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 24px;
        }

        p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-light);
            margin-bottom: 30px;
        }

        .price-tag {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 30px;
        }

        .price-tag span {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-light);
        }

        .btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-container">
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <h1>Domain Has Expired</h1>
        <div class="domain-name">Skyxpress.site</div>
        
        <p>The registration period for this domain has ended. To prevent permanent deletion and restore your website and email services, kindly re-activate the domain immediately.</p>
        
        <div class="price-tag">
            $120.00 <span>USD</span>
        </div>

        <button class="btn" onclick="handleReactivation()">Re-Activate Domain</button>

        <div class="footer">
            &copy; 2026 Skyxpress.site. All rights reserved.
        </div>
    </div>

    <script>
        function handleReactivation() {
            alert("Redirecting to the secure billing portal to renew Skyxpress.site...");
        }
    </script>

</body>
</html>
